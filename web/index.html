<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Terravane</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='12' fill='%2304241a'/%3E%3Cpath d='M32 12c7 4 10 11 8 20H24c-2-9 1-16 8-20z' fill='%23e7d3a8'/%3E%3Cpath d='M16 42c6-4 11-6 16-6s10 2 16 6l-3 4c-5-3-8-4-13-4s-8 1-13 4z' fill='%23b6863b'/%3E%3C/svg%3E">
<link rel="stylesheet" href="/css/app.css">
</head>
<body class="bg-background text-on-surface min-h-screen">

<div class="min-h-screen grid lg:grid-cols-[1.05fr_1fr]">

  <!-- The pitch, and the honest note about what identity means here. -->
  <section class="relative bg-primary-deep text-gold-soft px-8 py-12 lg:px-16 lg:py-16 flex flex-col justify-between overflow-hidden">
    <div class="absolute inset-0 grain pointer-events-none"></div>

    <div class="relative flex items-center gap-3">
      <svg width="36" height="36" viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
        <path d="M32 6c8 4 12 12 10 22H22c-2-10 2-18 10-22z" fill="#e7d3a8"/>
        <path d="M14 38c6-4 12-6 18-6s12 2 18 6l-4 4c-5-3-9-4-14-4s-9 1-14 4z" fill="#b6863b"/>
        <rect x="24" y="18" width="14" height="12" rx="1" fill="#f3ecd8"/>
        <rect x="27" y="21" width="6" height="5" fill="#04241a"/>
        <circle cx="27" cy="34" r="5" fill="#f3ecd8"/><circle cx="27" cy="34" r="2" fill="#04241a"/>
        <circle cx="37" cy="34" r="4" fill="#f3ecd8"/><circle cx="37" cy="34" r="1.6" fill="#04241a"/>
      </svg>
      <span class="font-serif-display text-[24px] tracking-tight text-gold-soft" data-i18n="brand"></span>
    </div>

    <div class="relative max-w-lg rise-in">
      <h1 class="font-serif-display text-[40px] lg:text-[52px] leading-[1.08] text-white mb-5" data-i18n="login.title"></h1>
      <p class="font-body-lg text-body-lg text-gold-soft/75" data-i18n="login.subtitle"></p>

      <div class="mt-10 grid gap-4" id="chain-facts"></div>
    </div>

    <div class="relative font-label-sm text-[11px] tracking-widest uppercase text-gold-soft/40">
      <span data-i18n="login.secure"></span>
    </div>
  </section>

  <!-- Sign in -->
  <section class="px-6 py-12 lg:px-16 lg:py-16 flex items-center">
    <div class="w-full max-w-md mx-auto" id="signin-root"></div>
  </section>

</div>

<script type="module" src="/js/page-signin.js"></script>
</body>
</html>
