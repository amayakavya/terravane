<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Trace this produce</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='12' fill='%2304241a'/%3E%3Cpath d='M32 12c7 4 10 11 8 20H24c-2-9 1-16 8-20z' fill='%23e7d3a8'/%3E%3Cpath d='M16 42c6-4 11-6 16-6s10 2 16 6l-3 4c-5-3-8-4-13-4s-8 1-13 4z' fill='%23b6863b'/%3E%3C/svg%3E">
<link rel="stylesheet" href="/css/app.css">
</head>
<body class="bg-background text-on-surface min-h-screen flex flex-col">

<!-- Brand rail. The console carries the mark down the left in a dark sidebar;
     a public visitor has no sidebar to put it in, so it runs across the top
     instead — same ink, same grain, same wordmark. -->
<header class="relative bg-primary-deep text-gold-soft shrink-0">
  <div class="absolute inset-0 grain pointer-events-none"></div>
  <div class="relative max-w-[1400px] mx-auto flex items-center justify-between gap-4 px-5 lg:px-10 py-4">
    <a href="/index.html" class="flex items-center gap-3 hover:opacity-90 transition-opacity min-w-0">
      <span id="brand-mark" class="shrink-0"></span>
      <span class="min-w-0">
        <span class="block font-serif-display text-[22px] tracking-tight text-gold-soft leading-none" data-i18n="brand"></span>
        <span class="block font-label-sm text-[10px] tracking-widest uppercase text-gold-soft/45 mt-1 truncate" data-i18n="trace.publicRecord"></span>
      </span>
    </a>
    <button id="lang-toggle" type="button" class="flex items-center gap-1.5 px-3 py-2 rounded-full border border-gold-soft/25 hover:bg-white/5 transition-all text-gold-soft/80 hover:text-gold-soft font-body-sm text-body-sm shrink-0">
      <svg width="18" height="18" viewBox="0 -960 960 960" fill="currentColor" aria-hidden="true"><path d="m476-80 182-480h84L924-80h-84l-43-122H603L560-80h-84ZM160-200l-56-56 202-202q-35-35-63.5-80T190-640h84q20 39 40 68t48 58q33-33 68.5-92.5T484-720H40v-80h280v-80h80v80h280v80H564q-21 72-63 148t-83 116l96 98-30 82-122-125-202 201Zm468-72h144l-72-204-72 204Z"/></svg>
      <span data-lang-label></span>
    </button>
  </div>
</header>

<!-- Lot identity bar. Mirrors the console topbar: serif title on the left with a
     mono sub-line, status on the right — and stays put while the record scrolls. -->
<div id="lotbar" class="sticky top-0 z-30 bg-surface-bright border-b border-outline-variant/70 shrink-0 hidden"></div>

<main id="root" class="flex-1 max-w-[1400px] w-full mx-auto px-5 lg:px-10 py-6 lg:py-8"></main>

<footer id="foot" class="relative bg-primary-deep text-gold-soft mt-auto shrink-0"></footer>

<script type="module" src="/js/page-trace.js"></script>
</body>
</html>
